<div class="login-page">
  <div class="login-box">
    <h1>Welcome Back</h1>
    <p>Login to your applicant account</p>

    <form (ngSubmit)="login()">
      <label>Email Address</label>
      <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required />

      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required />

      <p *ngIf="errorMessage" style="color: red; font-size: 13px; margin-bottom: 10px;">
        {{ errorMessage }}
      </p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <button class="home-btn" (click)="goHome()">Back to Home</button>
  </div>
</div>
