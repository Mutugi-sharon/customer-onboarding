<div class="login-page">

  <div class="login-box">

    <h1>Welcome Back</h1>

    <p>Login to your applicant account</p>

    <form (ngSubmit)="login()">

      <label>Email Address</label>
      <input
        type="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <button class="home-btn" (click)="goHome()">
      Back to Home
    </button>

  </div>

</div>
