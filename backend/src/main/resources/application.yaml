
spring:
  application:
    name: onboarding
  datasource:
    url: jdbc:postgresql://localhost:5432/customer_onboarding
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

